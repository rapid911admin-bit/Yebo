<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>YeboCard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surf: #ffffff;
  --tx: #0f172a;
  --mu: #64748b;
  --ln: #e2e8f0;
  --ac: #0066cc;
  --ac-dark: #004b99;
  --sh: 0 4px 12px rgba(0, 0, 0, 0.05);
  --dark-bar: #4a5568;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.5 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
  background: #fff;
  min-height: 100vh;
  position: relative;
  box-shadow: 0 0 20px rgba(0,0,0,0.08);
}

svg { width: 20px; height: 20px; fill: currentColor; }
.mu { color: var(--mu); margin: 0; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
[hidden] { display: none !important; }

#app, .pg { display: grid; gap: 0; }
.pg { padding: 20px; gap: 14px; background: var(--bg); min-height: 100vh; }
.sk { height: 200px; background: #e2e8f0; }
.sk.s2 { height: 64px; margin: 10px; border-radius: 8px; }

.hd { display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 800; font-size: 24px; margin: 0; }

/* Top Cover Header */
.hero-cover {
  position: relative;
  width: 100%;
  height: 220px;
  background-color: #1e293b;
  background-size: cover;
  background-position: center;
  overflow: hidden;
}
.hero-logo-badge {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  padding: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  display: grid;
  place-items: center;
}
.hero-logo-badge img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

/* Contact Action Bar (Grey Strip) */
.contact-bar {
  background: var(--dark-bar);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  min-height: 48px;
}
.contact-bar-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}
.contact-bar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.contact-bar-btn {
  background: none;
  border: none;
  color: #fff;
  padding: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Brand Section */
.brand-header {
  padding: 20px 20px 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  background: #fff;
}
.brand-title h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  color: var(--ac);
  line-height: 1.2;
}
.brand-title p {
  margin: 4px 0 0;
  font-size: 14px;
  color: var(--mu);
}

/* Social Icon Strip */
.social-links {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--ln);
  background: #fff;
}
.social-icon {
  color: var(--ac);
  transition: transform 0.2s, color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
.social-icon:hover { transform: scale(1.1); }
.social-icon svg { width: 24px; height: 24px; }

/* Clean Action Items Container */
.acts-container {
  background: linear-gradient(180deg, #f0f4f8 0%, #ffffff 100%);
  padding: 16px 20px;
  display: grid;
  gap: 12px;
  min-height: 300px;
}
.act-item {
  display: block;
  text-decoration: none;
  padding: 12px 0;
  border-bottom: 1px solid rgba(226, 232, 240, 0.6);
}
.act-item:last-child { border-bottom: none; }
.act-item-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ac);
  margin: 0 0 2px 0;
}
.act-item-sub {
  font-size: 13px;
  color: var(--mu);
  margin: 0;
}

/* Admin Dashboard Overrides & Elements */
.ic { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--ln); border-radius: 12px; background: var(--surf); color: var(--tx); }
.act { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 12px 14px; background: var(--surf); border: 1px solid var(--ln); border-radius: 16px; box-shadow: var(--sh); color: var(--tx); text-decoration: none; font: inherit; font-weight: 600; text-align: left; }
.act span { flex: 1; min-width: 0; line-height: 1.25; }
.act small { display: block; margin-top: 2px; font-size: 14px; font-weight: 400; color: var(--mu); }
.dock { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 10px; padding: 14px 0; background: linear-gradient(transparent, var(--bg) 30%); }
.dock .btn { flex: 1; }
.pill { flex: none; font-style: normal; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #e2e8f0; color: var(--mu); }
.pill.live { background: #dcfce7; color: #15803d; }
.tabs2 { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; }
.tabs2 button { flex: none; min-height: 40px; padding: 0 16px; border: 1px solid var(--ln); border-radius: 999px; background: var(--surf); color: var(--tx); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }

/* Forms Elements */
.btn {
  display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px;
  border: 1px solid var(--ac); border-radius: 8px; background: var(--ac); color: #fff;
  font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; width: 100%;
}
.btn.alt { background: #fff; color: var(--tx); border-color: var(--ln); }
.f, .grp { display: grid; gap: 12px; }
.grp { padding: 16px; background: #fff; border: 1px solid var(--ln); border-radius: 12px; }
input:not([type=checkbox]), textarea, select {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--ln); border-radius: 8px; font: inherit;
}
label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--mu); }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: var(--surf); border: 1px solid var(--ln); border-radius: 16px; }
.sw small { display: block; color: var(--mu); font-size: 13px; font-weight: 400; }
.sw input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 52px; height: 30px; margin: 0; border-radius: 999px; background: var(--ln); transition: background .2s; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.sw input:checked { background: var(--ac); } .sw input:checked::after { transform: translateX(22px); }
.lrow { display: flex; align-items: center; gap: 14px; }
.pick { flex: 1; display: block; }
#lp { width: 72px; height: 72px; object-fit: contain; background: #fff; border: 1px solid var(--ln); border-radius: 14px; padding: 6px; }
#hp { width: 96px; height: 64px; object-fit: cover; border: 1px solid var(--ln); border-radius: 12px; }

details { margin: 16px 20px; background: #fff; border: 1px solid var(--ln); border-radius: 8px; overflow: hidden; }
summary { padding: 14px 16px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
details > div { padding: 0 16px 16px; color: var(--mu); }

.ft { text-align: center; color: var(--mu); font-size: 12px; padding: 24px 0; }
.sheet { position: fixed; inset: 0; z-index: 9; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.5); }
.sheet.on { display: flex; }
.sheet .in { width: 100%; max-width: 480px; padding: 20px; background: #fff; border-radius: 16px 16px 0 0; display: grid; gap: 12px; text-align: center; }
#qr { justify-self: center; padding: 10px; background: #fff; border: 1px solid var(--ln); border-radius: 8px; }
.toast { position: fixed; left: 50%; top: 20px; z-index: 10; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; background: #0f172a; color: #fff; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap"><main id="app"><div class="sk"></div><div class="sk s2"></div></main></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Share">
  <div class="in">
    <h2>Share this card</h2>
    <div id="qr"></div>
    <a class="btn" id="wa" target="_blank" rel="noopener">Share on WhatsApp</a>
    <button class="btn alt" id="cp">Copy link</button>
    <button class="btn alt" id="cl">Close</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// IMPORTANT: Add your Supabase details below
const SUPABASE_URL="https://gcquxurtomxbmrpwclka.supabase.co", SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjcXV4dXJ0b214Ym1ycHdjbGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MTg1NDIsImV4cCI6MjEwNjM5NDU0Mn0.eUY1UslqZk8BtRqgaMm4SdiIdlWr_28BvuB72nL1syw";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=(s,r=document)=>r.querySelector(s), app=$("#app");
const esc=t=>String(t??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const digits=p=>{const d=String(p||"").replace(/\D/g,"");return d.startsWith("0")?"27"+d.slice(1):d};
const slugify=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40).replace(/-+$/,"");
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),3000)};

const SVG = {
  fb: `<svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>`,
  ig: `<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z" fill="none" stroke="currentColor" stroke-width="2"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="currentColor" stroke-width="2"/></svg>`,
  li: `<svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>`,
  x: `<svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/></svg>`,
  yt: `<svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 00-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 00-1.94 2A29 29 0 001 11.75a29 29 0 00.46 5.33A2.78 2.78 0 003.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 001.94-2 29 29 0 00.46-5.25 29 29 0 00-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="#fff"/></svg>`,
  userPlus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>`,
  share: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>`
};

/* ---------- Public Card View ---------- */
async function view(slug){
  const {data:c, error:ce} = await db.from("cards").select("*").eq("slug",slug).maybeSingle();
  if(!c){
    app.innerHTML=`<div class="pg" style="padding:20px;"><h1 class="brand">${ce?"Could not load":"Card not found"}</h1><p class="mu">${ce?"Check your connection.":"This link is not active."}</p></div>`;
    return;
  }
  document.title = c.name;
  if(c.accent && /^#[0-9a-f]{6}$/i.test(c.accent)){
    document.documentElement.style.setProperty("--ac", c.accent);
  }

  const hu = safe(c.hero_url) || "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1000&q=80";
  const logo = safe(c.logo_url);
  const ini = c.name.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();

  const sl = c.social_links || {};
  const socialsHtml = `
    ${sl.facebook ? `<a href="${esc(safe(sl.facebook))}" class="social-icon" target="_blank" title="Facebook">${SVG.fb}</a>` : ''}
    ${sl.instagram ? `<a href="${esc(safe(sl.instagram))}" class="social-icon" target="_blank" title="Instagram">${SVG.ig}</a>` : ''}
    ${sl.linkedin ? `<a href="${esc(safe(sl.linkedin))}" class="social-icon" target="_blank" title="LinkedIn">${SVG.li}</a>` : ''}
    ${sl.x ? `<a href="${esc(safe(sl.x))}" class="social-icon" target="_blank" title="X (Twitter)">${SVG.x}</a>` : ''}
    ${sl.youtube ? `<a href="${esc(safe(sl.youtube))}" class="social-icon" target="_blank" title="YouTube">${SVG.yt}</a>` : ''}
  `;

  const acts = [];
  if(c.phone) acts.push({t:"Call Direct", s:c.phone, u:"tel:+"+digits(c.phone)});
  if(c.whatsapp) acts.push({t:"WhatsApp Us", s:"Instant Message", u:"https://wa.me/"+digits(c.whatsapp)});
  if(c.email) acts.push({t:"Email Support", s:c.email, u:"mailto:"+encodeURIComponent(c.email)});
  if(c.website) acts.push({t:"Visit Website", s:c.website.replace(/^https?:\/\//,""), u:c.website});
  if(c.address) acts.push({t:"Our Location", s:c.address, u:"https://maps.google.com/?q="+encodeURIComponent(c.address)});

  app.innerHTML = `
    <div class="hero-cover" style="background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.4)), url('${esc(hu)}')">
      <div class="hero-logo-badge">
        ${logo ? `<img src="${esc(logo)}" alt="Logo">` : `<span style="font-weight:800;color:var(--ac);">${esc(ini)}</span>`}
      </div>
    </div>
    <div class="contact-bar">
      <div class="contact-bar-title">SHOW CONTACT DETAILS &#9660;</div>
      <div class="contact-bar-actions">
        <button class="contact-bar-btn" id="save" title="Save Contact">${SVG.userPlus}</button>
        <button class="contact-bar-btn" id="share" title="Share">${SVG.share}</button>
      </div>
    </div>
    <div class="brand-header">
      <div class="brand-title">
        <h1>${esc(c.name)}</h1>
        <p>${esc(c.role || 'Sales | Parts | Services')}</p>
      </div>
      <div style="font-size:20px; font-weight:bold; cursor:pointer;">&#9776;</div>
    </div>
    
    ${socialsHtml.trim().length > 0 ? `<div class="social-links">${socialsHtml}</div>` : ''}

    <div class="acts-container">
      ${acts.map(a=>`<a class="act-item" href="${esc(a.u)}" target="_blank" rel="noopener"><h2 class="act-item-title">${esc(a.t)}</h2><p class="act-item-sub">${esc(a.s)}</p></a>`).join('')}
      ${(c.tabs||[]).map(t=>`<div class="act-item"><h2 class="act-item-title">${esc(t.title)}</h2><p class="act-item-sub">${esc(t.body)}</p></div>`).join('')}
    </div>
    <details>
      <summary>Send an enquiry</summary>
      <div class="f">
        <input id="en" placeholder="Your name">
        <textarea id="em" placeholder="How can we help?" rows="3"></textarea>
        <button class="btn" id="es">Send Message</button>
      </div>
    </details>
    <div class="ft">Powered by YeboCard</div>
  `;

  $("#save").onclick = () => {
    const v = ["BEGIN:VCARD","VERSION:3.0","FN:"+(c.contact_name||c.name),"ORG:"+c.name,c.phone&&"TEL;TYPE=WORK,VOICE:+"+digits(c.phone),c.email&&"EMAIL:"+c.email,"END:VCARD"].filter(Boolean).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([v],{type:"text/vcard"}));
    a.download = (c.slug||"contact") + ".vcf";
    a.click();
  };

  $("#share").onclick = () => {
    $("#sheet").classList.add("on");
    const q = $("#qr"); q.innerHTML = "";
    try { new QRCode(q, {text: location.href, width: 150, height: 150}); } catch(e) {}
    $("#wa").href = "https://wa.me/?text=" + encodeURIComponent(c.name + " - " + location.href);
  };

  $("#cp").onclick = () => navigator.clipboard.writeText(location.href).then(() => toast("Link copied"));
  $("#cl").onclick = () => $("#sheet").classList.remove("on");

  $("#es").onclick = async () => {
    const n = $("#en").value.trim(), m = $("#em").value.trim();
    if(!m) return toast("Please type a message first");
    if(c.published) await db.from("leads").insert({card_id: c.id, name: n || null, message: m});
    if(c.whatsapp) window.open("https://wa.me/" + digits(c.whatsapp) + "?text=" + encodeURIComponent(`Hi ${c.name}, I am ${n||"a visitor"}. ${m}`), "_blank");
    toast("Enquiry sent");
    $("#em").value = "";
  };
}

/* ---------- Admin Dashboard & Routing ---------- */
let ME=null, U=null;

async function admin(){
  app.style.background = "var(--bg)"; // Reset background for admin mode
  const {data:{session}} = await db.auth.getSession();
  if(!session){
    app.innerHTML=`<div class="pg"><h1 class="brand">YeboCard Setup</h1><p class="mu">Sign in to manage your digital cards.</p>
      <div class="grp">
        <input id="lm" type="email" placeholder="Email address">
        <input id="lp" type="password" placeholder="Password">
        <button class="btn" id="lg">Sign in</button>
      </div></div>`;
    $("#lg").onclick = async () => {
      const {error} = await db.auth.signInWithPassword({email: $("#lm").value, password: $("#lp").value});
      if(error) toast("Incorrect login"); else admin();
    };
    return;
  }
  
  const email = (session.user.email||"").toLowerCase();
  const {data:me} = await db.from("members").select("*").eq("email",email).maybeSingle();
  if(!me||!me.active){
    app.innerHTML=`<div class="pg"><h1 class="brand">Account Inactive</h1><p class="mu">Contact your admin.</p><button class="btn alt" id="so">Sign out</button></div>`;
    $("#so").onclick=async()=>{await db.auth.signOut(); admin()};
    return;
  }
  ME=me; U=session.user;
  list(U);
}

function go(name,fn){if(location.hash!=="#/"+name)history.pushState(null,"","#/"+name);scrollTo(0,0);fn()}
window.addEventListener("popstate",()=>{(location.hash=="#/new"?pick(U):list(U))});

async function list(u){
  let q=db.from("cards").select("*").order("created_at");
  if(ME.role!="admin") q=q.eq("owner_email",ME.email);
  const {data,error}=await q;
  const adm=ME.role=="admin", rows=data||[];
  
  app.innerHTML=`<div class="pg">
    <div class="hd"><h1 class="brand">${adm?"All cards":"Your cards"}</h1></div>
    <div class="tabs2"><button id="so">Sign out</button></div>
    ${rows.length?rows.map((c,i)=>`<button class="act" data-i="${i}"><span>${esc(c.name)}<small>${esc(location.host)}/${esc(c.slug)}</small></span><em class="pill${c.published?" live":""}">${c.published?"Live":"Draft"}</em></button>`).join(""):'<p class="mu">No cards yet.</p>'}
    <div class="dock"><button class="btn" id="nw">New card</button></div>
  </div>`;
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>go("edit",()=>edit(u,rows[b.dataset.i])));
  $("#nw").onclick=()=>go("new",()=>edit(u,{}));
  $("#so").onclick=async()=>{await db.auth.signOut(); ME=null; U=null; admin()};
}

async function edit(u,c){
  c = {name:"", slug:"", accent:"#0066cc", published:false, social_links:{}, tabs:[], ...c};
  
  const F = (id,l,v,x="") => `<label>${l}<input id="${id}" value="${esc(v)}" ${x}></label>`;
  
  app.innerHTML=`<div class="pg">
    <div class="hd"><button class="ic" id="bk">${SVG.back}</button><h1 class="brand">${c.id?"Edit card":"New card"}</h1></div>
    <div class="grp"><h2>Basic Info</h2>
      ${F("name","Business Name",c.name)}
      ${F("role","Subtitle (e.g. Sales | Parts)",c.role)}
      ${F("slug","Link name (your-domain/link-name)",c.slug,'autocapitalize="none"')}
    </div>
    
    <div class="grp"><h2>Contact Details</h2>
      ${F("phone","Phone Number",c.phone,'inputmode="tel"')}
      ${F("whatsapp","WhatsApp Number",c.whatsapp,'inputmode="tel"')}
      ${F("email","Email Address",c.email,'inputmode="email"')}
      ${F("website","Website",c.website,'inputmode="url"')}
      ${F("address","Physical Address",c.address)}
    </div>

    <div class="grp"><h2>Social Links</h2>
      ${F("sl_facebook","Facebook URL",c.social_links.facebook||'','inputmode="url" placeholder="https://facebook.com/..."')}
      ${F("sl_instagram","Instagram URL",c.social_links.instagram||'','inputmode="url" placeholder="https://instagram.com/..."')}
      ${F("sl_linkedin","LinkedIn URL",c.social_links.linkedin||'','inputmode="url" placeholder="https://linkedin.com/..."')}
      ${F("sl_x","X (Twitter) URL",c.social_links.x||'','inputmode="url" placeholder="https://x.com/..."')}
      ${F("sl_youtube","YouTube URL",c.social_links.youtube||'','inputmode="url" placeholder="https://youtube.com/..."')}
    </div>

    <div class="grp"><h2>Directory Sections</h2><div id="tbs" class="grp" style="padding:0;border:0;"></div><button class="btn alt" id="at">Add Section</button></div>
    
    <label class="sw"><span><b>Live</b><small>Anyone with the link can see this card</small></span><input id="pub" type="checkbox" role="switch"${c.published?" checked":""}></label>
    <div class="dock"><button class="btn" id="sv">Save Card</button>${c.id?`<a class="btn alt" href="?c=${esc(c.slug)}" target="_blank">Preview</a>`:""}</div>
  </div>`;
  
  $("#bk").onclick=()=>location.hash?history.back():list(u);
  
  const drawT=()=>$("#tbs").innerHTML=c.tabs.map((t,i)=>`<div class="grp" style="border:1px solid #e2e8f0;margin-bottom:10px;"><input data-tt="${i}" value="${esc(t.title)}" placeholder="Title (e.g. BMW Sales)"><textarea data-tb="${i}" placeholder="Description">${esc(t.body)}</textarea><button class="btn alt" data-tx="${i}">Remove</button></div>`).join("");
  drawT();
  
  $("#at").onclick=()=>{c.tabs.push({title:"",body:""}); drawT()};
  $("#tbs").addEventListener("input",e=>{const d=e.target.dataset; if(d.tt!=null)c.tabs[d.tt].title=e.target.value; if(d.tb!=null)c.tabs[d.tb].body=e.target.value;});
  $("#tbs").addEventListener("click",e=>{if(e.target.dataset.tx!=null){c.tabs.splice(e.target.dataset.tx,1); drawT()}});

  $("#sv").onclick = async () => {
    const normUrl = t => { t=(t||"").trim(); if(!t)return null; return /^https?:\/\//i.test(t)?t:"https://"+t; };
    const v = id => $("#"+id).value.trim() || null;
    
    const p = {
      name: v("name"), role: v("role")||"", slug: slugify(v("slug")||v("name")),
      phone: v("phone"), whatsapp: v("whatsapp"), email: v("email"), address: v("address"), website: normUrl(v("website")),
      social_links: {
        facebook: normUrl(v("sl_facebook")),
        instagram: normUrl(v("sl_instagram")),
        linkedin: normUrl(v("sl_linkedin")),
        x: normUrl(v("sl_x")),
        youtube: normUrl(v("sl_youtube"))
      },
      tabs: c.tabs.filter(t=>t.title||t.body),
      published: $("#pub").checked
    };
    
    if(!p.name) return toast("Name required");
    if(p.slug.length<3) return toast("Slug too short");
    
    const q = c.id 
      ? await db.from("cards").update(p).eq("id",c.id).select().single() 
      : await db.from("cards").insert(p).select().single();
      
    if(q.error) return toast(q.error.message);
    toast("Saved successfully");
    edit(u, q.data);
  };
}

const seg = location.pathname.split("/").filter(Boolean);
const sl = new URLSearchParams(location.search).get("c") || (seg.length==1 && seg[0]);
if(sl && sl !== "admin") { view(sl); } else { admin(); }
</script>
</body>
</html>
