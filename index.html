<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f3f6">
<title>YeboCard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f6;--surf:#fff;--tx:#101828;--mu:#5d6b7c;--ln:#e3e8ee;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);--ac:#0a7d5a;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--surf:#151f2b;--tx:#eef3f8;--mu:#9db0c2;--ln:#243447;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1118;--surf:#151f2b;--tx:#eef3f8;--mu:#9db0c2;--ln:#243447;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
h1,h2,.brand{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;letter-spacing:-.02em}
h2{margin:0;font-size:17px}
button,select{cursor:pointer}
:is(button,a,select,summary,input,textarea):focus-visible{outline:3px solid var(--ac);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mu{color:var(--mu);margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
[hidden]{display:none!important}
#app,.pg{display:grid;gap:14px}
#app>*{animation:up .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes sh{to{background-position:-200% 0}}
.sk{height:200px;border-radius:24px;background:linear-gradient(90deg,var(--ln) 25%,var(--surf) 50%,var(--ln) 75%) 0 0/200% 100%}
#app>.sk{animation:sh 1.3s linear infinite}.sk.s2{height:64px;border-radius:16px}
.pg{padding-top:20px}.brand{font-weight:800;font-size:24px;margin:0}
.hd{display:flex;align-items:center;gap:12px}.hd .brand{font-size:22px}
.top{display:flex;justify-content:flex-end;padding:12px 0 0}
.ic{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--ln);border-radius:12px;background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.hero{background:var(--ac);background:linear-gradient(155deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#000));color:#fff;border-radius:24px;padding:20px;display:grid;gap:16px;box-shadow:var(--sh)}
.logo{width:60px;height:60px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);display:grid;place-items:center;font:800 21px "Bricolage Grotesque",sans-serif}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.hero h1{margin:0;font-size:clamp(24px,7vw,30px);line-height:1.1;overflow-wrap:anywhere}
.hero p{margin:6px 0 0;opacity:.92;font-size:15px}
.hero.img{background-size:cover;background-position:center}
.bn{position:relative;height:var(--bh,76px);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.25);touch-action:pan-y}
.sl{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px 14px 14px;background:center/cover;font-size:14px;line-height:1.35;opacity:0;transition:opacity .8s ease}
.sl.on{opacity:1}
.sl span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:calc(100% - 60px);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.dots{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:6px}
.dots button{position:relative;width:8px;height:8px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.5);transition:width .35s,background .35s}
.dots button::after{content:"";position:absolute;inset:-12px -4px}
.dots button.on{width:20px;background:#fff}
.bar{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.btn,.bar button{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 16px;border:1px solid var(--ac);border-radius:14px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;text-decoration:none;transition:transform .15s,opacity .15s}
.btn.alt,.bar button.alt{background:var(--surf);color:var(--tx);border-color:var(--ln)}
.btn:active,.act:active,.bar button:active{transform:scale(.985)}
.btn:disabled{opacity:.5}
.acts{display:grid;gap:10px}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 14px;background:var(--surf);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);color:var(--tx);text-decoration:none;font:inherit;font-weight:600;text-align:left;transition:transform .15s}
.act i{flex:none;width:42px;height:42px;border-radius:12px;background:var(--ac);color:var(--on);display:grid;place-items:center}
.act span{flex:1;min-width:0;line-height:1.25}
.act small{display:block;margin-top:2px;font-size:14px;font-weight:400;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{flex:none;width:8px;height:8px;margin-right:4px;border-top:2px solid var(--mu);border-right:2px solid var(--mu);transform:rotate(45deg)}
.act.sos{background:#b42318;border-color:#b42318;color:#fff}.act.sos i{background:rgba(255,255,255,.2)}.act.sos small{color:#ffd9d6}.act.sos .go{border-color:#ffd9d6}
.pill{flex:none;font-style:normal;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--mu)}
.pill.live{background:#dcfce7;background:color-mix(in srgb,#22a05a 18%,transparent);color:#15803d}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips span{flex:none;padding:8px 14px;background:var(--surf);border:1px solid var(--ln);border-radius:999px;font-size:14px;font-weight:500}
details,.grp{background:var(--surf);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh)}
details{overflow:hidden}
summary{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 16px;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;margin-top:-3px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .25s,margin .25s}
details[open] summary::after{margin-top:3px;transform:rotate(225deg)}
details>div{padding:0 16px 16px;color:var(--mu)}
.f,.grp{display:grid;gap:12px}.grp{padding:16px}
input:not([type=checkbox]),textarea,select{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;transition:border-color .15s}
input:not([type=checkbox]):focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{min-height:88px;resize:vertical}
label,.lb{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mu)}
.lb{margin-bottom:2px}
.row{display:grid;gap:10px;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--bg)}
.row .thumb{height:96px}
.thumb{width:100%;max-height:110px;object-fit:cover;border-radius:10px}
.lrow{display:flex;align-items:center;gap:14px}.pick{flex:1;display:block}.pick .btn{width:100%}
.pick:focus-within .btn{outline:3px solid var(--ac);outline-offset:2px}
#lp{flex:none;width:72px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:6px}
.hint{color:var(--mu);font-size:12.5px;line-height:1.4}
.stk{flex:1;display:grid;gap:8px}
#hp{flex:none;width:96px;height:64px;object-fit:cover;border:1px solid var(--ln);border-radius:12px}
.hero .who{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}.who svg{flex:none;width:16px;height:16px}
.sw2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw2 button{width:38px;height:38px;padding:0;border:3px solid var(--surf);border-radius:50%;outline:1px solid var(--ln)}
.sw2 button.on{outline:2px solid var(--tx)}
.sw2 input[type=color]{width:38px;min-height:38px;height:38px;padding:0;border:0;border-radius:50%;background:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;background:var(--bg);border:1px solid var(--ln);border-radius:12px}
.seg button{min-height:42px;border:0;border-radius:9px;background:none;color:var(--mu);font:inherit;font-weight:600;transition:background .2s,color .2s}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surf);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);color:var(--tx);font-size:16px}
.sw small{display:block;color:var(--mu);font-size:13px;font-weight:400}
.sw input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:52px;height:30px;margin:0;border-radius:999px;background:var(--ln);transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked{background:var(--ac)}.sw input:checked::after{transform:translateX(22px)}
.dock{position:sticky;bottom:0;z-index:4;display:flex;gap:10px;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.dock .btn{flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:4px;align-content:start;min-height:96px;padding:14px;text-align:left;background:var(--surf);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:16px;box-shadow:var(--sh);color:var(--tx);font:inherit;transition:transform .15s}
.tile b{font-size:15px;line-height:1.25}.tile small{color:var(--mu);font-size:12.5px;line-height:1.35}.tile:active{transform:scale(.985)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kv{display:flex;justify-content:space-between}
.ft{text-align:center;color:var(--mu);font-size:13px}
.sheet{position:fixed;inset:0;z-index:9;display:none;align-items:flex-end;justify-content:center;background:rgba(16,24,40,.5)}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:480px;max-height:92%;overflow-y:auto;display:grid;gap:10px;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));background:var(--surf);border-radius:24px 24px 0 0;text-align:center;animation:rise .3s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
#qr{justify-self:center;min-height:60px;padding:14px;background:#fff;border:1px solid var(--ln);border-radius:16px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));z-index:10;max-width:calc(100% - 32px);transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:var(--tx);color:var(--bg);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
html{scroll-behavior:smooth}
#app>*,.pg>*{min-width:0}
.tabs2{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;min-height:40px;padding:0 16px;border:1px solid var(--ln);border-radius:999px;background:var(--surf);color:var(--tx);font:inherit;font-size:14px;font-weight:500}
.empty{display:grid;gap:4px;padding:32px 16px;text-align:center;background:var(--surf);border:1px dashed var(--ln);border-radius:16px}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
.cta .btn{flex:1;max-width:232px}
.wrap.cta-pad{padding-bottom:104px}
@media (max-width:360px){.hero{padding:16px}.bar,.tiles{grid-template-columns:1fr}}
@media (hover:hover){.act:hover,.btn:hover{transform:translateY(-1px)}.btn.alt:hover{border-color:var(--ac)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><main id="app"><div class="sk"></div><div class="sk s2"></div><div class="sk s2"></div></main></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Share"><div class="in">
  <h2>Share this card</h2><div id="qr"></div>
  <a class="btn" id="wa" target="_blank" rel="noopener">Share on WhatsApp</a>
  <button class="btn alt" id="cp">Copy link</button><button class="btn alt" id="cl">Close</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// 1. Paste your own Supabase details here (Project Settings > API).
const SUPABASE_URL="https://gcquxurtomxbmrpwclka.supabase.co", SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjcXV4dXJ0b214Ym1ycHdjbGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MTg1NDIsImV4cCI6MjEwNjM5NDU0Mn0.eUY1UslqZk8BtRqgaMm4SdiIdlWr_28BvuB72nL1syw";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=(s,r=document)=>r.querySelector(s), app=$("#app");
const esc=t=>String(t??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const digits=p=>{const d=String(p||"").replace(/\D/g,"");return d.startsWith("0")?"27"+d.slice(1):d};
const slugify=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40).replace(/-+$/,"");
const svg=d=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const IC={tel:svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>'),
 wa:svg('<path d="M4 5h16v11H9l-5 4z"/>'),mail:svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
 map:svg('<path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
 loc:svg('<circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>'),
 sos:svg('<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'),
 sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>'),
 moon:svg('<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>'),
 back:svg('<path d="M15 5l-7 7 7 7"/>'),
 user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>'),
 web:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>')};
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),Math.max(2500,m.length*55))};
const isDark=()=>(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";

/* ---------- Public card ---------- */
async function view(slug){
  const {data:c,error:ce}=await db.from("cards").select("*").eq("slug",slug).maybeSingle();
  if(!c){app.innerHTML=`<div class="pg"><h1 class="brand">${ce?"Could not load":"Card not found"}</h1><p class="mu">${ce?"Check your connection and try again.":"This link is not active."}</p></div>`;return}
  document.title=c.name;
  const th=store.get("yc_theme")||(c.theme!=="auto"?c.theme:"");if(th)document.documentElement.dataset.theme=th;
  document.documentElement.style.setProperty("--ac",/^#[0-9a-f]{6}$/i.test(c.accent)?c.accent:"#0a7d5a");
  {const m=$("meta[name=theme-color]");if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue("--ac").trim()}
  const log=k=>{if(c.published)db.from("events").insert({card_id:c.id,kind:k}).then(()=>{},()=>{})};
  log("view");
  const A=[];
  if(c.panic_phone){A.push(["sos","sos","Panic / emergency line",c.panic_phone,"tel:+"+digits(c.panic_phone)]);A.push(["location","loc","Send my location","Share where you are via WhatsApp","#loc"])}
  if(c.phone)A.push(["call","tel","Call",c.phone,"tel:+"+digits(c.phone)]);
  if(c.whatsapp)A.push(["whatsapp","wa","WhatsApp","Message us","https://wa.me/"+digits(c.whatsapp)]);
  if(c.email)A.push(["email","mail","Email",c.email,"mailto:"+encodeURIComponent(c.email).replace("%40","@")]);
  if(c.website&&/^https?:\/\//.test(c.website))A.push(["website","web","Website",c.website.replace(/^https?:\/\//,""),c.website]);
  if(c.address)A.push(["map","map","Find us",c.address,"https://maps.google.com/?q="+encodeURIComponent(c.address)]);
  const B=(c.banners||[]).filter(b=>b&&(b.text||b.image_url)),img=B.some(b=>b.image_url),logo=safe(c.logo_url),hu=safe(c.hero_url),who=c.contact_name||c.designation;
  const ini=c.name.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
  app.innerHTML=`<div class="top"><button class="ic" id="th" aria-label="Switch light or dark mode"></button></div>
  <section class="hero${hu?" img":""}"${hu?` style="background-image:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.62)),url('${encodeURI(hu).replace(/'/g,"%27")}')"`:""}><div class="logo">${logo?`<img src="${esc(logo)}" alt="">`:esc(ini)}</div>
   <div><h1>${esc(c.name)}</h1><p>${esc(c.role)}</p>${who?`<p class="who">${IC.user}<span><b>${esc(c.contact_name||"")}</b>${c.contact_name&&c.designation?" · ":""}${esc(c.designation||"")}</span></p>`:""}</div>
   ${B.length?`<div class="bn" id="bn" style="--bh:${img?156:76}px" role="region" aria-roledescription="carousel" aria-label="Promotions">${B.map((b,i)=>{const u=safe(b.image_url);return `<div class="sl${i?"":" on"}"${u?` style="background-image:linear-gradient(transparent 30%,rgba(0,0,0,.72)),url('${encodeURI(u).replace(/'/g,"%27")}')"`:""}><span>${esc(b.text||"")}</span></div>`}).join("")}${B.length>1?`<div class="dots">${B.map((b,i)=>`<button aria-label="Show banner ${i+1}"${i?"":' class="on"'}></button>`).join("")}</div>`:""}</div>`:""}</section>
  <div class="bar"><button id="save">Save contact</button><button class="alt" id="share">Share</button></div>
  <div class="acts">${A.map(a=>`<a class="act${a[0]=="sos"?" sos":""}" data-k="${a[0]}" href="${esc(a[4])}" target="_blank" rel="noopener"><i>${IC[a[1]]}</i><span>${a[2]}<small>${esc(a[3])}</small></span><b class="go"></b></a>`).join("")}</div>
  ${(c.chips||[]).length?`<div class="chips">${c.chips.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
  <details><summary>Send an enquiry</summary><div class="f"><input id="en" aria-label="Your name" placeholder="Your name"><textarea id="em" aria-label="Message" placeholder="How can we help?" maxlength="1000"></textarea><button class="btn" id="es">Send</button></div></details>
  ${(c.tabs||[]).map((t,i)=>`<details${i?"":" open"}><summary>${esc(t.title)}</summary><div>${esc(t.body)}</div></details>`).join("")}
  ${(c.phone||c.whatsapp)?`<div class="cta">${c.phone?`<a class="btn" data-k="call" href="tel:+${digits(c.phone)}">Call</a>`:""}${c.whatsapp?`<a class="btn${c.phone?" alt":""}" data-k="whatsapp" href="https://wa.me/${digits(c.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>`:""}
  <div class="ft">Made with YeboCard</div>`;

  return new Promise(r=>cv.toBlob(r,type,.85));
}

  <div class="grp"><h2>Contact</h2>${F("contact_name","Contact person",c.contact_name,'placeholder="e.g. Zweli Mkhize"')}${F("designation","Designation or title",c.designation,'placeholder="e.g. Managing Director"')}${F("phone","Phone",c.phone,'inputmode="tel"')}${F("whatsapp","WhatsApp number",c.whatsapp,'inputmode="tel"')}${F("email","Email",c.email,'inputmode="email"')}${F("website","Website",c.website,'inputmode="url" autocapitalize="none" placeholder="www.example.co.za"')}${F("address","Address or town",c.address)}${F("panic_phone","Emergency line (optional, adds a panic button)",c.panic_phone,'inputmode="tel"')}</div>
  <div class="grp"><h2>Look</h2><div class="lrow"><img id="lp" alt="Logo preview" ${c.logo_url?`src="${esc(c.logo_url)}"`:"hidden"}><label class="pick"><span class="btn alt">${c.logo_url?"Change logo":"Upload logo"}</span><input class="vh" id="logo" type="file" accept="image/*"></label></div><small class="hint">${SPEC.logo.txt}</small>
   <div><div class="lb">Brand colour</div><div class="sw2" id="sw2">${COLS.map(x=>`<button type="button" data-c="${x}" style="background:${x}" aria-label="Colour ${x}"></button>`).join("")}<input id="accent" type="color" value="${esc(c.accent)}" aria-label="Custom colour"></div></div>
   <div><div class="lb">Header image (optional)</div><div class="lrow"><img id="hp" alt="Header preview" ${c.hero_url?`src="${esc(c.hero_url)}"`:"hidden"}><div class="stk"><label class="pick"><span class="btn alt" id="hbt">${c.hero_url?"Change image":"Upload image"}</span><input class="vh" id="hero" type="file" accept="image/*"></label><button type="button" class="btn alt" id="hrm"${c.hero_url?"":" hidden"}>Remove image</button></div></div><small class="hint">${SPEC.hero.txt} It replaces the colour on the card header.</small></div>
   <div><div class="lb">Card theme</div><div class="seg" id="seg">${["auto","light","dark"].map(t=>`<button type="button" data-t="${t}" class="${t==c.theme?"on":""}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div><input id="theme" type="hidden" value="${esc(c.theme)}"></div></div>
  <div class="grp"><h2>Promo banners</h2><div id="bns" class="grp" style="padding:0;border:0;box-shadow:none"></div><button class="btn alt" id="ab">Add banner</button></div>
  <div class="grp"><h2>Info sections</h2><div id="tbs" class="grp" style="padding:0;border:0;box-shadow:none"></div><button class="btn alt" id="at">Add section</button></div>
  <label class="sw"><span><b>Live</b><small>Anyone with the link can see this card</small></span><input id="pub" type="checkbox" role="switch"${c.published?" checked":""}></label>
  ${c.id?'<div class="grp" id="st"></div>':""}<div class="dock"><button class="btn" id="sv">Save</button>${c.id?`<a class="btn alt" href="?c=${esc(c.slug)}" target="_blank" rel="noopener">Preview</a>`:""}</div></div>`;
  const drawB=()=>$("#bns").innerHTML=c.banners.map((b,i)=>`<div class="row"><input data-bt="${i}" value="${esc(b.text)}" placeholder="Banner message" aria-label="Banner message">${b.image_url?`<img class="thumb" src="${esc(b.image_url)}" alt="">`:""}<label class="pick"><span class="btn alt">${b.image_url?"Change image":"Add image"}</span><input class="vh" type="file" accept="image/*" data-bf="${i}" aria-label="Banner image"></label><small class="hint">${SPEC.banner.txt}</small><button class="btn alt" data-bx="${i}">Remove</button></div>`).join("");
  const drawT=()=>$("#tbs").innerHTML=c.tabs.map((t,i)=>`<div class="row"><input data-tt="${i}" value="${esc(t.title)}" placeholder="Title" aria-label="Section title"><textarea data-tb="${i}" placeholder="Details" aria-label="Section details">${esc(t.body)}</textarea><button class="btn alt" data-tx="${i}">Remove</button></div>`).join("");
  drawB();drawT();
  const mark=()=>$("#sw2").querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("on",b.dataset.c.toLowerCase()==$("#accent").value.toLowerCase()));mark();
  $("#sw2").onclick=e=>{const x=e.target.dataset.c;if(x){$("#accent").value=x;mark()}};$("#accent").oninput=mark;
  $("#seg").onclick=e=>{const t=e.target.dataset.t;if(t){$("#theme").value=t;[...$("#seg").children].forEach(b=>b.classList.toggle("on",b.dataset.t==t))}};
  $("#hero").onchange=async e=>{if(!e.target.files[0])return;try{toast("Uploading…");c.hero_url=await upImg(e.target.files[0],"hero");$("#hp").src=c.hero_url;$("#hp").hidden=false;$("#hrm").hidden=false;$("#hbt").textContent="Change image"}catch(x){toast(x.message)}};
  $("#hrm").onclick=()=>{c.hero_url=null;$("#hp").hidden=true;$("#hrm").hidden=true;$("#hbt").textContent="Upload image"};
  $("#bk").onclick=()=>location.hash?history.back():list(u);
  $("#ab").onclick=()=>{if(c.banners.length<5){c.banners.push({text:"",image_url:""});drawB()}};
  $("#at").onclick=()=>{if(c.tabs.length<6){c.tabs.push({title:"",body:""});drawT()}};
  $("#bns").addEventListener("input",e=>{if(e.target.dataset.bt!=null)c.banners[e.target.dataset.bt].text=e.target.value});
  $("#bns").addEventListener("click",e=>{if(e.target.dataset.bx!=null){c.banners.splice(e.target.dataset.bx,1);drawB()}});
  $("#bns").addEventListener("change",async e=>{const i=e.target.dataset.bf;if(i==null||!e.target.files[0])return;
    try{toast("Uploading…");c.banners[i].image_url=await upImg(e.target.files[0],"banner");drawB()}catch(x){toast(x.message)}});
  $("#tbs").addEventListener("input",e=>{const d=e.target.dataset;if(d.tt!=null)c.tabs[d.tt].title=e.target.value;if(d.tb!=null)c.tabs[d.tb].body=e.target.value});
  $("#tbs").addEventListener("click",e=>{if(e.target.dataset.tx!=null){c.tabs.splice(e.target.dataset.tx,1);drawT()}});
  $("#logo").onchange=async e=>{if(!e.target.files[0])return;try{toast("Uploading…");c.logo_url=await upImg(e.target.files[0],"logo");$("#lp").src=c.logo_url;$("#lp").hidden=false;$("#lp").nextElementSibling.firstElementChild.textContent="Change logo"}catch(x){toast(x.message)}};
  const save=async()=>{const v=id=>$("#"+id).value.trim()||null;
    const p={biz_type:c.biz_type||"other",contact_name:v("contact_name"),designation:v("designation"),website:normUrl(v("website")),hero_url:c.hero_url||null,name:v("name"),role:v("role")||"",slug:slugify(v("slug")||v("name")),phone:v("phone"),whatsapp:v("whatsapp"),email:v("email"),address:v("address"),panic_phone:v("panic_phone"),
      chips:$("#chips").value.split(",").map(x=>x.trim()).filter(Boolean),accent:$("#accent").value,theme:$("#theme").value,logo_url:c.logo_url||null,
      banners:c.banners.filter(b=>b.text||b.image_url),tabs:c.tabs.filter(t=>t.title||t.body),published:$("#pub").checked};
    if(v("website")&&!p.website)return toast("Enter a valid website, for example www.example.co.za");
    if(ME.role=="admin")p.owner_email=$("#owner").value;
    if(!p.name)return toast("Add a name first");
    if(p.slug.length<3)return toast("Add a business name (or link name) with at least 3 letters or numbers");
    if(["admin","login","api","app","www"].includes(p.slug))return toast("That link name is reserved. Try another.");
    $("#slug").value=p.slug;
    const q=c.id?await db.from("cards").update(p).eq("id",c.id).select().single():await db.from("cards").insert(p).select().single();
    if(q.error)return toast(q.error.code=="23505"?"That link name is taken":q.error.message);
    toast("Saved");edit(u,q.data)};
  $("#sv").onclick=async()=>{const b=$("#sv");b.disabled=true;b.textContent="Saving…";await save();if(b.isConnected){b.disabled=false;b.textContent="Save"}};
  if(c.id){
    const {data:s}=await db.rpc("card_stats",{p_card:c.id});
    const {data:l}=await db.from("leads").select("name,message").eq("card_id",c.id).order("created_at",{ascending:false}).limit(10);
    $("#st").innerHTML="<h2>Activity</h2>"+((s||[]).map(r=>`<div class="kv"><span>${esc(r.kind)}</span><b>${r.n}</b></div>`).join("")||'<p class="mu">No activity yet.</p>')+"<h2>Latest enquiries</h2>"+((l||[]).map(x=>`<p class="mu"><b>${esc(x.name||"Someone")}</b>: ${esc(x.message)}</p>`).join("")||'<p class="mu">None yet.</p>');
  }
}

/* ---------- Router ---------- */
const seg=location.pathname.split("/").filter(Boolean);
const slug=new URLSearchParams(location.search).get("c")||(seg.length==1&&/^[a-z0-9][a-z0-9-]{2,39}$/.test(seg[0])?seg[0]:"");
slug?view(slug):admin();
</script>
</body>
</html>
